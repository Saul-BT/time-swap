name: Bug report
description: Something does not work as the docs or the acceptance criteria say.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: What you see, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1.
        2.
        3.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      multiple: true
      options:
        - Front end
        - Back end
        - Not sure
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where
      description: URL or endpoint, browser and screen width if relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Screenshots, console output, response bodies. Remove any personal data first.
